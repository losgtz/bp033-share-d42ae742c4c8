const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},km,256));}
async function dec(raw,buf){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const u=new Uint8Array(buf);
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12)));}
const msg=t=>document.getElementById('msg').textContent=t;
async function openWith(raw){
